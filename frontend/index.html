<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Simplifier — Understand Any Research Paper</title>
  <meta name="description" content="Upload any academic or IEEE research paper PDF and get a clear, simplified explanation instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Research Simplifier
      </div>
      <p class="header-tagline">Upload a paper. Get a simple explanation.</p>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="container main">

    <!-- ── STEP 1: Upload ── -->
    <section class="card" id="uploadSection">
      <h1 class="section-title">Upload Research Paper</h1>
      <p class="section-desc">
        Upload a PDF research paper (IEEE, arXiv, or any academic PDF). It will be read and simplified automatically.
      </p>

      <!-- Drop Zone -->
      <label class="drop-zone" id="dropZone" for="fileInput" tabindex="0" role="button" aria-label="Upload PDF file">
        <div class="drop-zone-content" id="dropZoneContent">
          <svg class="drop-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="12" y2="12"/>
            <line x1="15" y1="15" x2="12" y2="12"/>
          </svg>
          <p class="drop-text">Drag and drop your PDF here</p>
          <p class="drop-subtext">or click to select a file</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden aria-hidden="true" />
      </label>

      <!-- File Info (shown after selection) -->
      <div class="file-info hidden" id="fileInfo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <div class="file-details">
          <span class="file-name" id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
        </div>
        <button class="btn-icon" id="removeFileBtn" aria-label="Remove file" title="Remove file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Error -->
      <div class="alert alert-error hidden" id="uploadError" role="alert"></div>

      <!-- Upload Button -->
      <button class="btn btn-primary" id="uploadBtn" disabled aria-label="Upload and simplify paper">
        Upload &amp; Simplify Paper
      </button>
    </section>

    <!-- ── Processing (shown while uploading + simplifying) ── -->
    <section class="card hidden" id="processingSection">
      <div class="loading" id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span id="loadingText">Uploading your paper...</span>
      </div>
    </section>

    <!-- ── Results ── -->
    <section class="card hidden" id="resultsSection">
      <!-- Paper info bar -->
      <div class="paper-loaded-bar">
        <div class="paper-loaded-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="uploadedFileName"></span>
          <span class="paper-word-count" id="wordCountLabel"></span>
        </div>
        <button class="btn btn-sm btn-outline" id="removeBtn" aria-label="Remove paper and start over">
          Remove &amp; Start Over
        </button>
      </div>

      <!-- Results header -->
      <div class="results-header">
        <h2 class="section-title" style="margin-bottom:0">Simplified Explanation</h2>
        <div class="results-actions">
          <button class="btn btn-sm btn-outline" id="copyBtn" aria-label="Copy explanation to clipboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>

      <!-- Error -->
      <div class="alert alert-error hidden" id="simplifyError" role="alert"></div>

      <!-- Results Content -->
      <div class="results-body" id="resultsBody"></div>
    </section>

  </main>



  <!-- Toast Notification -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
